<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Bencana24/7 menyediakan pemantauan bencana dan cuaca real-time dengan insight AI untuk membantu kesiapsiagaan publik di Indonesia."
    />
    <meta name="robots" content="index,follow" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="dicoding:email" content="anonymousblack987@gmail.com">
    <style>
      .boot-seed {
        min-height: 100vh;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        padding: 20px 18px 36px;
        background:
          radial-gradient(circle at 20% 20%, rgba(30, 41, 59, 0.08), transparent 45%),
          radial-gradient(circle at 80% 10%, rgba(59, 130, 246, 0.08), transparent 50%),
          #f8fafc;
        color: #0f172a;
        font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      }

      .boot-seed-header {
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .boot-seed-brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
      }

      .boot-seed-badge {
        width: 34px;
        height: 34px;
        border-radius: 12px;
        background: #0f172a;
        color: #fff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 14px;
      }

      .boot-seed-title {
        font-size: 35px;
        font-weight: 600;
        letter-spacing: -0.03em;
        margin: 0 0 10px;
        text-align: center;
      }

      .boot-seed-avatar {
        width: 40px;
        height: 40px;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.06);
      }

      .boot-seed-main {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }

      .boot-seed-subtitle {
        margin: 0 0 22px;
        color: #64748b;
        max-width: 620px;
        line-height: 1.6;
      }

      .boot-seed-search {
        width: min(860px, 100%);
        height: 58px;
        border-radius: 30px;
        border: 1px solid rgba(148, 163, 184, 0.28);
        background: rgba(255, 255, 255, 0.86);
        box-shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px 0 22px;
        color: #94a3b8;
        font-size: 17px;
      }
    </style>
    <title>Bencana24/7 | Disaster Intelligence</title>
  </head>
  <body>
    <div id="root">
      <div class="boot-seed" aria-hidden="true">
        <div class="boot-seed-header">
          <div class="boot-seed-brand">
            <strong>Bencana24/7</strong>
          </div>
          <div class="boot-seed-avatar"></div>
        </div>
        <main class="boot-seed-main">
          <h1 class="boot-seed-title">Disaster Intelligence &amp; Response</h1>
          <p class="boot-seed-subtitle">Real-time monitoring, early warnings, and AI-driven insights for disaster management and public safety.</p>
          <div class="boot-seed-search">
            <span>Ask about any location, disaster, or weather...</span>
            <span>GO</span>
          </div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
